name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # heavy/awkward deps (torch, simglucose) stay out of CI; tests that need
      # them self-skip via importorskip. Everything else runs here.
      - run: pip install numpy pandas scikit-learn pyyaml pytest ruff
      - run: ruff check src tests
      - run: PYTHONPATH=src pytest -q
