name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # lightweight while the pipeline is being built; heavy deps (torch,
      # simglucose) get added here as the modules that need them land.
      - run: pip install pyyaml pytest ruff
      - run: ruff check src tests
      - run: PYTHONPATH=src pytest -q
